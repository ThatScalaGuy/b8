# Scala Steward repository configuration.
# https://github.com/scala-steward-org/scala-steward/blob/main/docs/repo-specific-configuration.md
#
# Bundles dependency updates into a handful of meaningful PRs instead of one PR
# per dependency. Groups are evaluated top-to-bottom and the FIRST matching
# group wins, so the version-based buckets only catch what the ecosystem groups
# above them don't. Inside a grouping filter the keys are `group` / `artifact`
# / `version` (note: not `groupId` / `artifactId`).
pullRequests.grouping = [
  # Container backends: fs2 tracks cats-effect, and scodec-bits moves with it,
  # so keep the b8-fs2 / b8-scodec stack in one PR.
  { name = "containers", title = "FS2 & scodec updates", filter = [
    { group = "co.fs2" },
    { group = "org.typelevel" },
    { group = "org.scodec" }
  ]},

  # Serialization backends behind the bridge modules (jsoniter, circe, borer,
  # ScalaPB). Each bridge is pinned to its backend's binary API, so a bump here
  # always needs the bridge tests to be looked at together.
  { name = "backends", title = "Serialization backend updates", filter = [
    { group = "com.github.plokhotnyuk.jsoniter-scala" },
    { group = "io.circe" },
    { group = "io.bullet" },
    { group = "com.thesamet.scalapb" }
  ]},

  # Test toolchain (munit, munit-scalacheck, scalacheck).
  { name = "test-libraries", title = "Test library updates", filter = [
    { group = "org.scalameta" },
    { group = "org.scalacheck" }
  ]},

  # Everything else, split by semver bump so low-risk patches can be merged
  # quickly and minor/major bumps get a closer look.
  { name = "patches", title = "Patch updates", filter = [
    { version = "patch" }
  ]},
  { name = "minor-and-major", title = "Minor & major updates", filter = [
    { version = "minor" },
    { version = "major" }
  ]},

  # Safety net so nothing falls back to one-PR-per-update.
  { name = "all", title = "Other dependency updates", filter = [
    { group = "*" }
  ]}
]

# Scala 3.3 is the LTS line b8 targets on purpose; a bump to a Next release is a
# deliberate decision, not a routine dependency update.
updates.pin = [
  { groupId = "org.scala-lang", artifactId = "scala3-library", version = { prefix = "3.3." } },
  # sbt 2.x is a breaking rewrite of the build definition, not a routine bump, so
  # moving to it is a deliberate migration rather than something to take from a
  # dependency-update PR. Pin to the 1.x line: patch/minor sbt 1 releases still
  # come through, sbt 2 proposals don't. Note these keys are `groupId` /
  # `artifactId`, unlike the `group` / `artifact` used in the filters above.
  { groupId = "org.scala-sbt", artifactId = "sbt", version = { prefix = "1." } }
]
